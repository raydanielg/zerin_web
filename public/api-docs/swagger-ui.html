<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Xerin API Docs - Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
  <style>
    body{margin:0;padding:0;}
    .topbar-wrapper img{content:url('');display:none;}
    .topbar{background-color:#024938;}
    .topbar-wrapper span{font-weight:800;font-size:1.2rem;letter-spacing:0.5px;}
    .swagger-ui .topbar .download-url-wrapper{display:none;}
    .swagger-ui .info .title{color:#024938;}
    .swagger-ui .scheme-container{box-shadow:none;}
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: 'openapi.json',
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'StandaloneLayout'
      });
    };
  </script>
</body>
</html>
